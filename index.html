<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>燃气客户移动工作台</title>
<style>
  :root{
    --blue:#3D8BFF; --blue-dark:#2456C4; --blue-deep:#1F48B0; --blue-light:#EBF3FF;
    --bg:#eef2f8; --card:#ffffff; --text:#1a2233; --sub:#7a8699;
    --line:#e6ebf3; --orange:#ff8f1f; --orange-deep:#ff6a00;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); font-size:14px;
    display:flex; justify-content:center;
  }
  .phone{
    width:100%; max-width:480px; min-height:100vh; background:var(--bg);
    position:relative; display:flex; flex-direction:column;
    box-shadow:0 0 0 1px rgba(20,40,80,.04);
  }
  /* ===== 状态栏 ===== */
  .statusbar{
    height:30px; flex:none; display:flex; align-items:center; justify-content:space-between;
    padding:0 18px; color:#fff; font-size:13px; font-weight:600;
    background:linear-gradient(135deg,var(--blue) 0%,var(--blue-dark) 100%);
    font-variant-numeric:tabular-nums;
  }
  .statusbar .icons{display:flex;align-items:center;gap:5px;}
  .statusbar svg{display:block;}
  /* ===== 内容滚动区 ===== */
  .home{flex:1;overflow-y:auto;padding-bottom:24px;display:flex;flex-direction:column;}
  .home::-webkit-scrollbar{display:none;}
  /* ===== 顶部 hero ===== */
  .hero{
    flex:none; background:linear-gradient(135deg,var(--blue) 0%,var(--blue-dark) 55%,var(--blue-deep) 100%);
    color:#fff; padding:22px 20px 26px; position:relative; overflow:hidden;
  }
  .hero::before{
    content:""; position:absolute; right:-40px; top:-50px; width:180px; height:180px;
    border-radius:50%; background:rgba(255,255,255,.08);
  }
  .hero::after{
    content:""; position:absolute; right:30px; bottom:-70px; width:140px; height:140px;
    border-radius:50%; background:rgba(255,255,255,.06);
  }
  .hero-top{display:flex;align-items:center;gap:14px;position:relative;z-index:2;}
  .avatar{
    width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.25); display:flex;align-items:center;justify-content:center;
    font-size:26px; flex:none; box-shadow:0 4px 12px rgba(0,0,0,.12);
  }
  .hero-info{flex:1;min-width:0;}
  .hero-info .hello{font-size:13px;opacity:.9;}
  .hero-info .name{font-size:20px;font-weight:700;margin-top:2px;letter-spacing:.5px;}
  .hero-badge{
    flex:none; font-size:11px; background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.28);
    padding:5px 12px; border-radius:99px; font-weight:600;
  }
  .hero-date{margin-top:18px;font-size:12px;opacity:.85;position:relative;z-index:2;}
  /* ===== 统计条 ===== */
  .stats{
    flex:none; margin:-14px 14px 0; background:#fff; border-radius:14px; padding:14px 6px;
    display:flex; box-shadow:0 6px 18px rgba(36,86,196,.10); position:relative; z-index:3;
  }
  .stat{flex:1;text-align:center;}
  .stat + .stat{border-left:1px solid var(--line);}
  .stat .v{font-size:20px;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums;}
  .stat .k{font-size:11px;color:var(--sub);margin-top:2px;}
  /* ===== 分组标题 ===== */
  .section-title{
    flex:none; margin:22px 16px 10px; display:flex; align-items:center; gap:8px;
    font-size:15px; font-weight:700;
  }
  .section-title::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--blue);}
  /* ===== 快捷功能宫格 ===== */
  .cards{
    flex:none; margin:0 14px; background:#fff; border-radius:16px; padding:18px 8px 16px;
    display:grid; grid-template-columns:repeat(3,1fr); gap:4px;
    box-shadow:0 1px 0 rgba(255,255,255,1) inset, 0 2px 6px rgba(20,40,80,.05), 0 8px 20px rgba(20,40,80,.05);
    border:1px solid rgba(20,40,80,.03);
  }
  .card{
    display:flex; flex-direction:column; align-items:center; gap:10px; padding:6px 4px;
    background:none; border:none; box-shadow:none; cursor:pointer;
    transition:transform .15s; -webkit-tap-highlight-color:transparent;
  }
  .card:active{transform:scale(.94);}
  .card-ico{
    width:54px;height:54px;border-radius:16px;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:26px; color:#fff;
  }
  .card-ico.orange{background:linear-gradient(135deg,#ff9d3c,#ff6a00);box-shadow:0 4px 12px rgba(255,106,0,.30);}
  .card-ico.blue{background:linear-gradient(135deg,var(--blue),var(--blue-dark));box-shadow:0 4px 12px rgba(61,139,255,.30);}
  .card-ico.cyan{background:linear-gradient(135deg,#4fb3ff,#3D8BFF);box-shadow:0 4px 12px rgba(61,139,255,.28);}
  .card-body{width:100%;text-align:center;min-width:0;}
  .card-title{font-size:13px;font-weight:600;line-height:1.35;}
  .card-sub{display:none;}
  .card-tags{display:none;}
  .tag{display:inline-block;font-size:11px;padding:4px 10px;border-radius:8px;font-weight:600;white-space:nowrap;}
  .tag-orange{background:#fff3e8;color:#e65100;}
  .tag-blue{background:var(--blue-light);color:var(--blue-dark);}
  .tag-cyan{background:#e6f4ff;color:#0a7ab8;}
  .chev{display:none;}
  /* ===== 页脚 ===== */
  .footnote{
    flex:none; margin:auto 0 0; padding-top:30px; text-align:center; font-size:11px; color:#b0b8c5;
  }
  /* ===== 子功能 iframe 全屏容器（保持 480px 手机宽度居中） ===== */
  .appframe{
    position:fixed; top:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px; height:100%; background:#fff;
    z-index:100; display:flex; flex-direction:column;
    box-shadow:0 0 0 1px rgba(20,40,80,.04);
  }
  .appframe.hidden{display:none;}
  .appframe iframe{width:100%;height:100%;border:none;display:block;background:#fff;}
  /* 返回首页胶囊（悬浮在状态栏中部的空白处） */
  .back-pill{
    position:fixed; top:6px; left:50%; transform:translateX(-50%); z-index:120;
    display:flex; align-items:center; gap:3px; padding:5px 14px; border-radius:99px;
    background:#fff; color:var(--blue); font-size:12px; font-weight:600; cursor:pointer;
    box-shadow:0 2px 10px rgba(20,40,80,.22); border:1px solid rgba(61,139,255,.18);
    letter-spacing:.3px;
  }
  .back-pill:active{background:var(--blue-light);}
</style>
</head>

  function b64ToUtf8(b64){
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }

  function openApp(i){
    var f = document.getElementById("frame");
    f.srcdoc = b64ToUtf8(APPS[i].b64);
    document.getElementById("appframe").classList.remove("hidden");
    window.scrollTo(0, 0);
  }

  function goHome(){
    document.getElementById("appframe").classList.add("hidden");
    document.getElementById("frame").srcdoc = "";
  }

  function pad(n){ return n < 10 ? "0" + n : "" + n; }

  function refreshClock(){
    var d = new Date();
    document.getElementById("sTime").textContent = d.getHours() + ":" + pad(d.getMinutes());
    var h = d.getHours();
    var hi = h < 6 ? "凌晨好" : h < 9 ? "早上好" : h < 12 ? "上午好" : h < 14 ? "中午好" : h < 18 ? "下午好" : "晚上好";
    document.getElementById("hello").textContent = hi + " 👋";
    var wd = ["日","一","二","三","四","五","六"][d.getDay()];
    document.getElementById("sDate").textContent = d.getFullYear() + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日 · 星期" + wd;
  }
  refreshClock();
  setInterval(refreshClock, 30000);
</script>
